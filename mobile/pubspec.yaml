name: unifits_mobile
description: uniFITS Member Portal — Flutter mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  provider: ^6.1.2

  # UI / fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Supabase (ready for backend swap)
  supabase_flutter: ^2.5.6

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
